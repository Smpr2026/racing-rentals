<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D1B2A">
<title>Racing — Yard</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yard">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#0D1B2A; --ink-2:#2C3E52; --mute:#63707F;
  --line:#DFE6EF; --brand:#2F6BFF; --brand-dk:#1E4FD0; --wash:#EDF2FF;
  --ok:#0E9F6E; --warn:#F79009; --bad:#E0533B;
  --r:14px; --r-lg:18px;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
[hidden]{display:none !important}
button,input,select,textarea{font-family:inherit; font-size:16px}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}

/* ── shell ── */
.app{display:flex; flex-direction:column; min-height:100%}
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--ink); color:#fff; padding:12px 16px;
  display:flex; align-items:center; gap:12px;
}
.top h1{margin:0; font-size:16px; font-weight:800; letter-spacing:-.02em; flex:1}
.top .sub{font-size:12.5px; color:#9FB3CC; font-weight:500}
.iconbtn{
  border:none; background:rgba(255,255,255,.12); color:#fff; width:34px; height:34px;
  border-radius:10px; cursor:pointer; display:grid; place-items:center; flex:0 0 auto;
}
.bar{height:3px; background:rgba(255,255,255,.15)}
.bar i{display:block; height:100%; width:100%; background:var(--brand);
  transform:scaleX(0); transform-origin:left center;
  transition:transform .3s cubic-bezier(.2,.8,.3,1)}

main{flex:1 1 auto; padding:16px 16px 96px; max-width:640px; width:100%; margin:0 auto}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:16px; margin-bottom:14px}
h2.step{font-size:26px; font-weight:800; letter-spacing:-.035em; margin:2px 0 6px;
  line-height:1.15}
p.hint{margin:0 0 14px; color:var(--mute); font-size:14.5px}

.f{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.f label{font-size:12.5px; font-weight:700; color:var(--ink-2)}
.f input,.f select,.f textarea{
  border:1px solid var(--line); border-radius:var(--r); padding:13px 12px;
  background:#fff; color:var(--ink); width:100%;
}
.f textarea{min-height:74px; resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none; border-color:var(--brand); box-shadow:0 0 0 4px rgba(47,107,255,.15)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.f.filled input{background:#F3FBF7; border-color:#B7E4D0}

.btn{
  border:none; border-radius:var(--r); padding:15px 18px; font-weight:700;
  cursor:pointer; background:var(--brand); color:#fff; width:100%;
}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn.slim{padding:11px 14px; font-size:14.5px; width:auto}
.btn[disabled]{opacity:.45}

.foot{
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.94); border-top:1px solid var(--line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.foot .btn{flex:1}
.foot .btn.ghost{flex:0 0 96px}

/* ── home ── */
.pick{display:grid; gap:12px}
.pick button{
  text-align:left; border:1px solid var(--line); background:#fff; border-radius:var(--r-lg);
  padding:18px; cursor:pointer; display:flex; align-items:center; gap:14px;
}
.pick .ic{width:44px; height:44px; border-radius:12px; background:var(--wash);
  color:var(--brand); display:grid; place-items:center; flex:0 0 auto}
.pick b{display:block; font-size:17px; letter-spacing:-.02em}
.pick span{display:block; font-size:13.5px; color:var(--mute)}
.jobs{display:flex; flex-direction:column; gap:8px}
.job{
  display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line);
  border-radius:var(--r); padding:12px 14px; cursor:pointer; text-align:left; width:100%;
}
.job .tag{font-size:11px; font-weight:700; padding:3px 8px; border-radius:7px;
  background:var(--wash); color:var(--brand-dk)}
.job .tag.sale{background:#FFF3E6; color:#9A5B12}
.job b{font-size:15px; letter-spacing:-.02em}
.job small{display:block; color:var(--mute); font-size:12.5px}
.empty{color:var(--mute); font-size:14.5px; text-align:center; padding:22px}

/* ── licence capture ── */
.scan{
  border:1.5px dashed var(--line); border-radius:var(--r-lg); padding:18px;
  text-align:center; background:#FAFCFF;
}
.scan .big{width:52px; height:52px; border-radius:14px; background:var(--wash);
  color:var(--brand); display:grid; place-items:center; margin:0 auto 10px}
.scan b{display:block; font-size:15.5px; letter-spacing:-.02em}
.scan p{margin:4px 0 12px; font-size:13.5px; color:var(--mute)}
.scan input[type=file]{display:none}
.scan .row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.status{
  margin-top:12px; border-radius:var(--r); padding:11px 13px; font-size:14px;
  font-weight:600; display:flex; gap:9px; align-items:flex-start;
}
.status.work{background:var(--wash); color:var(--brand-dk)}
.status.good{background:#E7F8F0; color:#07553A}
.status.warn{background:#FFF4E5; color:#8A5200}
.spin{width:15px; height:15px; border:2px solid currentColor; border-right-color:transparent;
  border-radius:50%; animation:sp .7s linear infinite; flex:0 0 auto; margin-top:2px}
@keyframes sp{to{transform:rotate(360deg)}}
.raw{
  margin-top:10px; font-family:ui-monospace,Menlo,monospace; font-size:11.5px;
  background:#0D1B2A; color:#B9C7D9; border-radius:var(--r); padding:11px;
  white-space:pre-wrap; word-break:break-all; max-height:150px; overflow:auto;
}
.privacy{
  margin-top:12px; font-size:12.5px; color:var(--mute); display:flex; gap:8px;
  align-items:flex-start; line-height:1.45;
}

/* ── vehicle picker ── */
.vlist{display:grid; gap:10px}
.vrow{
  display:flex; align-items:center; gap:12px; border:1px solid var(--line);
  background:#fff; border-radius:var(--r); padding:10px 12px; cursor:pointer;
  text-align:left; width:100%;
}
.vrow.on{border-color:var(--brand); box-shadow:0 0 0 3px rgba(47,107,255,.14)}
.vrow img{width:76px; height:48px; object-fit:contain; flex:0 0 auto}
.vrow b{display:block; font-size:15px; letter-spacing:-.02em}
.vrow small{color:var(--mute); font-size:12.5px}
.vrow .pr{margin-left:auto; font-weight:800; font-size:15px; white-space:nowrap}

/* ── damage diagram ── */
.views{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.view{
  border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:8px;
  position:relative;
}
.view h4{margin:0 0 2px; font-size:11.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--mute); text-align:center}
.view .plate{position:relative; touch-action:manipulation; cursor:crosshair}
.view svg.art{display:block; width:100%; height:auto; color:#9AA7B6}
.mk{
  position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
  color:#fff; font-size:11px; font-weight:800; display:grid; place-items:center;
  box-shadow:0 1px 4px rgba(13,27,42,.4); border:2px solid #fff; cursor:pointer;
}
.legend{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px}
.legend button{
  border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px;
  font-size:13.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:7px;
}
.legend button.on{border-color:var(--ink); background:var(--ink); color:#fff}
.legend i{width:11px; height:11px; border-radius:50%; display:block}
.dmglist{margin-top:12px; display:flex; flex-direction:column; gap:8px}
.dmg{
  display:flex; gap:10px; align-items:center; background:#fff; border:1px solid var(--line);
  border-radius:var(--r); padding:10px 12px; font-size:14px;
}
.dmg .dot{width:22px; height:22px; border-radius:50%; color:#fff; font-size:11px;
  font-weight:800; display:grid; place-items:center; flex:0 0 auto}
.dmg input{border:none; flex:1; min-width:0; padding:4px 0; background:none}
.dmg input:focus{outline:none}
.dmg .x{border:none; background:none; color:var(--mute); cursor:pointer; font-size:18px;
  padding:0 2px}
.shots{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.shots img{width:74px; height:74px; object-fit:cover; border-radius:10px;
  border:1px solid var(--line)}

/* ── signature ── */
.sigwrap{border:1px solid var(--line); border-radius:var(--r); background:#fff;
  position:relative; overflow:hidden}
canvas#sig{display:block; width:100%; height:190px; touch-action:none}
.sigwrap .ph{position:absolute; inset:0; display:grid; place-items:center; color:#B9C4D2;
  font-size:14.5px; pointer-events:none}

/* ── review ── */
.sum{display:flex; flex-direction:column}
.sum div{display:flex; justify-content:space-between; gap:14px; padding:10px 0;
  border-top:1px solid var(--line); font-size:14.5px}
.sum div:first-child{border-top:none}
.sum dt{color:var(--mute)}
.sum dd{margin:0; font-weight:600; text-align:right}
@media print{
  .top,.foot,.noprint{display:none !important}
  body{background:#fff}
  main{padding:0; max-width:none}
  .card{border:none; padding:0; margin-bottom:18px; break-inside:avoid}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <button class="iconbtn" id="back" hidden aria-label="Back">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Racing — Yard<span class="sub" id="subtitle"></span></h1>
    <button class="iconbtn" id="home" aria-label="Home">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
    </button>
  </header>
  <div class="bar"><i id="prog" style="width:0"></i></div>

  <main id="view"></main>

  <div class="foot noprint" id="foot" hidden>
    <button class="btn ghost" id="prev">Back</button>
    <button class="btn" id="next">Next</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="diagram.js"></script>
<script src="app.js"></script>
</body>
</html>
